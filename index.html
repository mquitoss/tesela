<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tesela · Mapa configurable</title>

    <!-- Leaflet por CDN (zero-build, igual que quirat/invest-map) -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"
    />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    <link rel="stylesheet" href="src/ui/tesela.css" />
  </head>
  <body class="tesela-layout">
    <aside id="ssm-rail" class="tesela-rail" aria-label="Controles del mapa"></aside>
    <main id="ssm-map" class="tesela-map" aria-label="Mapa interactivo"></main>
    <aside id="ssm-detail" class="tesela-detail" aria-live="polite" aria-hidden="true"></aside>

    <!-- 1) Runtime Tesela: crea namespace nuevo y alias SSM compatible. -->
    <script src="src/engine/namespace.js"></script>

    <!-- 2) Configuración declarativa (el agente edita ESTO) -->
    <script src="app.config.js"></script>

    <!-- 3) Datos generados (window.TESELA_DATA + alias window.SSM_DATA). -->
    <script src="data/bundle.js"></script>

    <!-- 4) Engine agnóstico. ORDEN: geo y format antes de join. -->
    <script src="src/engine/format.js"></script>
    <script src="src/engine/geo.js"></script>
    <script src="src/engine/join.js"></script>
    <script src="src/engine/search.js"></script>
    <script src="src/engine/scoring.js"></script>
    <script src="src/engine/color.js"></script>
    <script src="src/engine/bundle.js"></script>
    <script src="src/engine/config.js"></script>
    <script src="src/engine/extensions.js"></script>

    <!-- 5) Hooks de dominio (opcionales) -->
    <script src="src/adapters/domain.js"></script>

    <!-- 6) Shell de aplicación -->
    <script src="src/app.js"></script>
  </body>
</html>
