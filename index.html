<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Self Service Map</title>

    <!-- Leaflet por CDN (zero-build, igual que quirat/invest-map) -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"
    />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

    <style>
      :root {
        --bg: #0a0e10;
        --panel: #121819;
        --ink: #e7efe9;
        --muted: #8aa;
        --accent: #5eead4;
        --line: #1e2729;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body {
        font: 14px/1.45 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        color: var(--ink);
        background: var(--bg);
        display: grid;
        grid-template-columns: 360px 1fr;
        height: 100vh;
        overflow: hidden;
      }
      #ssm-rail {
        background: var(--panel);
        border-right: 1px solid var(--line);
        padding: 18px 16px;
        overflow-y: auto;
      }
      #ssm-map { height: 100vh; }
      .ssm-brand h1 { font-size: 18px; margin: 0 0 2px; }
      .ssm-brand p { margin: 0 0 14px; color: var(--muted); font-size: 12px; }
      .ssm-status {
        font-size: 12px;
        color: var(--muted);
        padding: 8px 10px;
        background: #0e1416;
        border: 1px solid var(--line);
        border-radius: 8px;
        margin-bottom: 14px;
      }
      .ssm-section { margin-bottom: 16px; }
      .ssm-presets {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      .ssm-preset {
        padding: 9px 10px;
        background: #0e1416;
        color: var(--ink);
        border: 1px solid var(--line);
        border-radius: 8px;
        cursor: pointer;
        font-size: 12px;
      }
      .ssm-preset.active { border-color: var(--accent); color: var(--accent); }
      .ssm-sliders { display: grid; gap: 12px; }
      .ssm-slider { display: grid; grid-template-columns: 1fr; gap: 4px; font-size: 12px; }
      .ssm-slider > span:first-child { color: var(--muted); }
      .ssm-slider input { width: 100%; accent-color: var(--accent); }
      .ssm-slider-val { color: var(--accent); font-variant-numeric: tabular-nums; }
      .ssm-slider { position: relative; }
      .ssm-slider .ssm-slider-val { position: absolute; right: 0; top: 0; }
      .ssm-legend { margin-top: 8px; }
      .ssm-legend-label { font-size: 11px; color: var(--muted); margin-bottom: 6px; }
      .ssm-legend-bar { height: 10px; border-radius: 6px; }
      .ssm-legend-ends {
        display: flex;
        justify-content: space-between;
        font-size: 10px;
        color: var(--muted);
        margin-top: 4px;
      }
      .ssm-error { color: #f3b0b0; font-size: 13px; }
      .ssm-error code { color: var(--accent); }

      /* Panel de detalle (drawer derecho) */
      #ssm-detail {
        position: fixed;
        top: 0;
        right: 0;
        width: 300px;
        height: 100vh;
        background: var(--panel);
        border-left: 1px solid var(--line);
        padding: 18px 16px;
        transform: translateX(100%);
        transition: transform 0.2s ease;
        overflow-y: auto;
        z-index: 1000;
      }
      #ssm-detail.open { transform: translateX(0); }
      #ssm-detail h2 { font-size: 16px; margin: 0 0 10px; }
      #ssm-detail .ssm-score { color: var(--accent); margin-bottom: 12px; font-size: 13px; }
      .ssm-row {
        display: flex;
        justify-content: space-between;
        padding: 7px 0;
        border-bottom: 1px solid var(--line);
        font-size: 13px;
      }
      .ssm-row-label { color: var(--muted); }
      @media (prefers-reduced-motion: reduce) {
        #ssm-detail { transition: none; }
      }
    </style>
  </head>
  <body>
    <aside id="ssm-rail"></aside>
    <main id="ssm-map"></main>
    <aside id="ssm-detail"></aside>

    <!-- 1) Configuración declarativa (el agente edita ESTO) -->
    <script src="app.config.js"></script>

    <!-- 2) Datos generados por el pipeline (window.SSM_DATA) -->
    <script src="data/bundle.js"></script>

    <!-- 3) Engine domain-agnostic. ORDEN: geo y format antes de join. -->
    <script src="src/engine/format.js"></script>
    <script src="src/engine/geo.js"></script>
    <script src="src/engine/join.js"></script>
    <script src="src/engine/scoring.js"></script>
    <script src="src/engine/color.js"></script>
    <script src="src/engine/bundle.js"></script>

    <!-- 4) Hooks de dominio (opcionales) -->
    <script src="src/adapters/domain.js"></script>

    <!-- 5) Cableado de la app -->
    <script src="src/app.js"></script>
  </body>
</html>
